<!doctype html>
<html lang="es" data-slug="tarjeta-inclinacion">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Efectos Rednet</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..800&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../assets/demo.css">
<style>
html,body{margin:0;min-height:100%;background:radial-gradient(ellipse at 50% 0,#22201d,#0e0d0c 70%);color:#f2f0ec;font-family:Geist,system-ui,sans-serif}
main{min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:48px 16px 110px;gap:40px}
.lbl{font:500 12px/1 "Geist Mono",monospace;letter-spacing:.14em;text-transform:uppercase;color:#ff7a5c;text-align:center;display:block}
h1{font-size:clamp(32px,5vw,60px);letter-spacing:-.04em;margin:12px 0 0;text-align:center;line-height:1}
.grid{display:flex;flex-wrap:wrap;gap:28px;justify-content:center;perspective:1000px}
.tilt{width:min(310px,86vw);border-radius:22px;padding:26px;background:linear-gradient(160deg,#2a2723,#171513);border:1px solid rgba(255,255,255,.1);transform-style:preserve-3d;position:relative;will-change:transform;transition:transform .5s cubic-bezier(.2,.8,.2,1),box-shadow .5s;box-shadow:0 20px 50px rgba(0,0,0,.35)}
.tilt.on{transition:transform .08s linear,box-shadow .3s;box-shadow:0 40px 90px rgba(0,0,0,.55)}
.tilt>*{transform:translateZ(var(--z,0px))}
.tilt img{width:100%;height:170px;object-fit:cover;border-radius:14px;display:block;--z:50px}
.tilt h3{margin:18px 0 6px;font-size:24px;letter-spacing:-.02em;--z:70px}
.tilt p{margin:0;color:#b9b3aa;line-height:1.45;--z:35px}
.tilt .pr{display:flex;justify-content:space-between;align-items:center;margin-top:20px;--z:60px}
.tilt .pr b{font-size:30px;letter-spacing:-.03em}.tilt .pr button{all:unset;cursor:pointer;background:#f2f0ec;color:#0e0d0c;font-weight:600;font-size:14px;padding:10px 16px;border-radius:999px}
.tilt.hot{background:linear-gradient(160deg,#ff6a48,#b9301a);border-color:rgba(255,255,255,.25)}.tilt.hot p{color:#ffe2d9}
.glare{position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:radial-gradient(circle at var(--gx,50%) var(--gy,0%),rgba(255,255,255,.28),transparent 55%);opacity:0;transition:opacity .3s;mix-blend-mode:overlay;--z:80px}
.tilt.on .glare{opacity:1}
#gyro{all:unset;cursor:pointer;font:500 13px Geist;padding:10px 16px;border-radius:999px;border:1px solid rgba(255,255,255,.2);display:none}
</style>
</head>
<body>
<main>
 <div><span class="lbl">CSS 3D · JS puro · giroscopio en celular</span><h1>Tarjetas con profundidad</h1></div>
 <div class="grid">
  <article class="tilt"><img src="../../../wassaf/assets/img/bodegas.webp" alt=""><h3>Plan Bodega</h3><p>Hasta 200 posiciones de pallet y WMS incluido.</p><div class="pr"><b>UF 38</b><button>Cotizar</button></div><i class="glare"></i></article>
  <article class="tilt hot"><img src="../../../zayg/assets/img/modelo-450.webp" alt=""><h3>Plan Galpón 450</h3><p>Llave en mano, con permisos y montaje.</p><div class="pr"><b>Destacado</b><button>Cotizar</button></div><i class="glare"></i></article>
  <article class="tilt"><img src="../../../wassaf/assets/img/picking.webp" alt=""><h3>Plan E-commerce</h3><p>Picking, packing y despacho el mismo día.</p><div class="pr"><b>UF 24</b><button>Cotizar</button></div><i class="glare"></i></article>
 </div>
 <button id="gyro">Activar movimiento del teléfono</button>
</main>
<script>
const MAX=14; // grados máximos de inclinación
const cards=document.querySelectorAll('.tilt');
function set(c,px,py){c.style.transform='rotateX('+((.5-py)*MAX)+'deg) rotateY('+((px-.5)*MAX)+'deg)';c.style.setProperty('--gx',px*100+'%');c.style.setProperty('--gy',py*100+'%')}
cards.forEach(c=>{
 c.addEventListener('pointermove',e=>{if(e.pointerType!=='mouse')return;const r=c.getBoundingClientRect();c.classList.add('on');set(c,(e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height)});
 c.addEventListener('pointerleave',()=>{c.classList.remove('on');c.style.transform=''})});
// celular: inclina según el giro del teléfono (iOS pide permiso)
function gyro(){addEventListener('deviceorientation',e=>{if(e.beta==null)return;const px=.5+Math.max(-1,Math.min(1,e.gamma/30))/2,py=.5+Math.max(-1,Math.min(1,(e.beta-45)/30))/2;cards.forEach(c=>{c.classList.add('on');set(c,px,py)})})}
if(matchMedia('(pointer:coarse)').matches){const b=document.getElementById('gyro');
 if(typeof DeviceOrientationEvent!=='undefined'&&DeviceOrientationEvent.requestPermission){b.style.display='inline-flex';b.onclick=()=>DeviceOrientationEvent.requestPermission().then(r=>{if(r==='granted'){gyro();b.remove()}})}else gyro()}
</script>
<script src="../../assets/catalogo.js"></script>
<script src="../../assets/demo.js"></script>
</body>
</html>
