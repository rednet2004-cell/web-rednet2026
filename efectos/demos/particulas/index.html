<!doctype html>
<html lang="es" data-slug="particulas">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Efectos Rednet</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..800&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../assets/demo.css">
<style>html,body{margin:0;height:100%;background:#0e0d0c;color:#f2f0ec;font-family:Geist,system-ui,sans-serif;overflow:hidden}
.hero{position:relative;z-index:2;height:100%;display:grid;place-content:center;text-align:center;padding:0 16px;pointer-events:none}
.hero small{font:500 12px/1 "Geist Mono",monospace;letter-spacing:.14em;text-transform:uppercase;opacity:.75}
.hero h1{font-size:clamp(40px,8vw,104px);line-height:.95;letter-spacing:-.04em;margin:14px 0 0;font-weight:650}
.hero p{max-width:460px;margin:18px auto 0;color:#cfcac2;font-size:17px;line-height:1.5}
canvas{position:fixed;inset:0;width:100%;height:100%}</style>
</head>
<body>
<canvas id="c" aria-hidden="true"></canvas>
<div class="hero"><small>Canvas 2D · 0 dependencias</small><h1>Todo<br>conectado</h1><p>Pasa el mouse (o el dedo): los nodos se apartan y vuelven a su lugar.</p></div>
<script>
(()=>{
const c=document.getElementById('c'),x=c.getContext('2d'),dpr=Math.min(devicePixelRatio||1,2);
const COLOR='255,90,60', LINK=120, RADIO=140;            // <- ajusta aquí
let W,H,P=[],m={x:-999,y:-999};
function init(){W=c.width=innerWidth*dpr;H=c.height=innerHeight*dpr;const n=Math.round(innerWidth*innerHeight/9000);
  P=Array.from({length:n},()=>{const px=Math.random()*W,py=Math.random()*H;return{x:px,y:py,hx:px,hy:py,vx:0,vy:0,r:(Math.random()*1.6+.6)*dpr,ph:Math.random()*6.28}})}
addEventListener('resize',init);init();
addEventListener('pointermove',e=>{m.x=e.clientX*dpr;m.y=e.clientY*dpr});
addEventListener('pointerleave',()=>{m.x=m.y=-999});
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
(function f(t){requestAnimationFrame(f);x.clearRect(0,0,W,H);const L=LINK*dpr,R=RADIO*dpr;
  for(const p of P){const dx=p.x-m.x,dy=p.y-m.y,d=Math.hypot(dx,dy);
    if(d<R){const k=(1-d/R)*2.2;p.vx+=dx/d*k;p.vy+=dy/d*k}
    const wx=reduce?0:Math.sin(t/1600+p.ph)*6*dpr,wy=reduce?0:Math.cos(t/1900+p.ph)*6*dpr;
    p.vx+=(p.hx+wx-p.x)*.012;p.vy+=(p.hy+wy-p.y)*.012;p.vx*=.9;p.vy*=.9;p.x+=p.vx;p.y+=p.vy}
  x.lineWidth=dpr*.8;
  for(let i=0;i<P.length;i++)for(let j=i+1;j<P.length;j++){const a=P[i],b=P[j],d=Math.hypot(a.x-b.x,a.y-b.y);
    if(d<L){x.strokeStyle='rgba(242,240,236,'+(1-d/L)*.22+')';x.beginPath();x.moveTo(a.x,a.y);x.lineTo(b.x,b.y);x.stroke()}}
  for(const p of P){const near=Math.max(0,1-Math.hypot(p.x-m.x,p.y-m.y)/(R*1.4));
    x.fillStyle=near>0?'rgba('+COLOR+','+(.5+near*.5)+')':'rgba(242,240,236,.7)';x.beginPath();x.arc(p.x,p.y,p.r*(1+near*1.4),0,7);x.fill()}
})(0);
})();
</script>
<script src="../../assets/catalogo.js"></script>
<script src="../../assets/demo.js"></script>
</body>
</html>
