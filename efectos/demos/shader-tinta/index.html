<!doctype html>
<html lang="es" data-slug="shader-tinta">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Efectos Rednet</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..800&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../assets/demo.css">
<style>html,body{margin:0;height:100%;background:#0e0d0c;color:#f2f0ec;font-family:Geist,system-ui,sans-serif;overflow:hidden}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.hero{position:relative;z-index:2;height:100%;display:grid;place-content:center;text-align:center;padding:0 16px;pointer-events:none}
.hero small{font:500 12px/1 "Geist Mono",monospace;letter-spacing:.14em;text-transform:uppercase;opacity:.75}
.hero h1{font-size:clamp(40px,8vw,104px);line-height:.95;letter-spacing:-.04em;margin:14px 0 0;font-weight:650}
.hero p{max-width:460px;margin:18px auto 0;color:#cfcac2;font-size:17px;line-height:1.5}
.pal{position:fixed;z-index:3;top:16px;left:50%;transform:translateX(-50%);display:flex;gap:8px}
.pal button{all:unset;cursor:pointer;width:28px;height:28px;border-radius:50%;border:2px solid rgba(255,255,255,.25)}
.pal button[aria-pressed=true]{border-color:#fff;transform:scale(1.12)}
.hero h1{mix-blend-mode:difference}</style>
</head>
<body>
<canvas id="c" aria-hidden="true"></canvas>
<div class="pal" id="pal" aria-label="Paleta"></div>
<div class="hero"><small>Domain warping · ruido fractal</small><h1>Tinta<br>en el agua</h1><p>El mouse revuelve la mezcla. Cambia la paleta arriba.</p></div>
<script src="../../assets/shader.js"></script>
<script>
const frag=`
uniform vec3 uA;uniform vec3 uB;uniform vec3 uC;
float h(vec2 p){return fract(sin(dot(p,vec2(12.9898,78.233)))*43758.5453);}
float n(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h(i),h(i+vec2(1,0)),f.x),mix(h(i+vec2(0,1)),h(i+vec2(1,1)),f.x),f.y);}
float fbm(vec2 p){float v=0.,a=.5;mat2 r=mat2(.8,.6,-.6,.8);for(int i=0;i<5;i++){v+=a*n(p);p=r*p*2.02;a*=.5;}return v;}
void main(){
  vec2 uv=gl_FragCoord.xy/uRes;vec2 p=(gl_FragCoord.xy-.5*uRes)/uRes.y*2.2;
  vec2 m=(uMouse-.5)*vec2(uRes.x/uRes.y,1.)*2.2;
  float t=uTime*.08;
  float d=exp(-2.5*length(p-m));
  vec2 q=vec2(fbm(p+t),fbm(p+vec2(5.2,1.3)-t));
  vec2 r=vec2(fbm(p+3.5*q+vec2(1.7,9.2)+t*1.4+d*.8),fbm(p+3.5*q+vec2(8.3,2.8)-t));
  float f=fbm(p+3.*r);
  vec3 col=mix(vec3(.04,.035,.05),uA,clamp(f*f*2.2,0.,1.));
  col=mix(col,uB,clamp(length(q)*.9,0.,1.)*.75);
  col=mix(col,uC,clamp(r.x*r.x*1.6,0.,1.)*.55);
  col*=.55+.9*f;col*=1.-.3*length(uv-.5);
  gl_FragColor=vec4(col,1.);}`;
const pals=[['#ff5a3c','#3a1870','#ffd29a'],['#00c2a8','#0b2a5b','#e6fff6'],['#ff3d8b','#1b0f40','#7ad7ff'],['#c9a86a','#1a1a1a','#f2efe8']];
const s=fxShader(document.getElementById('c'),frag,{uA:fxHex(pals[0][0]),uB:fxHex(pals[0][1]),uC:fxHex(pals[0][2])});
const pal=document.getElementById('pal');
pals.forEach((p,i)=>{const b=document.createElement('button');b.style.background='conic-gradient('+p.join(',')+')';b.setAttribute('aria-label','Paleta '+(i+1));b.setAttribute('aria-pressed',i===0);b.onclick=()=>{['uA','uB','uC'].forEach((u,j)=>s.set(u,fxHex(p[j])));pal.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b))};pal.appendChild(b)});
</script>
<script src="../../assets/catalogo.js"></script>
<script src="../../assets/demo.js"></script>
</body>
</html>
