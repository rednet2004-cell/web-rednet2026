<!doctype html>
<html lang="es" data-slug="shader-aurora">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Efectos Rednet</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..800&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../assets/demo.css">
<style>html,body{margin:0;height:100%;background:#0e0d0c;color:#f2f0ec;font-family:Geist,system-ui,sans-serif;overflow:hidden}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.hero{position:relative;z-index:2;height:100%;display:grid;place-content:center;text-align:center;padding:0 16px;pointer-events:none}
.hero small{font:500 12px/1 "Geist Mono",monospace;letter-spacing:.14em;text-transform:uppercase;opacity:.75}
.hero h1{font-size:clamp(40px,8vw,104px);line-height:.95;letter-spacing:-.04em;margin:14px 0 0;font-weight:650}
.hero p{max-width:460px;margin:18px auto 0;color:#cfcac2;font-size:17px;line-height:1.5}
.pal{position:fixed;z-index:3;top:16px;left:50%;transform:translateX(-50%);display:flex;gap:8px}
.pal button{all:unset;cursor:pointer;width:28px;height:28px;border-radius:50%;border:2px solid rgba(255,255,255,.25)}
.pal button[aria-pressed=true]{border-color:#fff;transform:scale(1.12)}</style>
</head>
<body>
<canvas id="c" aria-hidden="true"></canvas>
<div class="pal" id="pal" aria-label="Paleta"></div>
<div class="hero"><small>Shader GLSL · sin librerías</small><h1>Luz que<br>se mueve</h1><p>Mueve el mouse: las cortinas se inclinan hacia ti.</p></div>
<script src="../../assets/shader.js"></script>
<script>
const frag=`
uniform vec3 uA;uniform vec3 uB;
float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
float n(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h(i),h(i+vec2(1,0)),f.x),mix(h(i+vec2(0,1)),h(i+vec2(1,1)),f.x),f.y);}
void main(){
  vec2 uv=gl_FragCoord.xy/uRes;float ar=uRes.x/uRes.y;vec2 p=vec2(uv.x*ar,uv.y);
  float t=uTime*.12;vec3 col=vec3(.035,.03,.04);
  for(int i=0;i<4;i++){float fi=float(i);
    float x=p.x*.9+fi*.37+(uMouse.x-.5)*.6*(1.-uv.y);
    float wave=n(vec2(x*1.6+t*(1.+fi*.3),fi*3.1+t))*.55+.25+fi*.05;
    float band=smoothstep(.0,.35,uv.y-wave+.25)*smoothstep(.75,.0,uv.y-wave);
    float rays=.55+.45*n(vec2(x*18.,t*2.+fi));
    vec3 c=mix(uA,uB,clamp(uv.y*1.3-fi*.15+.2*sin(t+fi),0.,1.));
    col+=c*band*rays*(.42-fi*.06);}
  col+=uB*.08*pow(1.-uv.y,3.);
  col*=1.-.35*length(uv-.5);
  gl_FragColor=vec4(pow(col,vec3(.9)),1.);}`;
const pals=[['#2ef2b4','#6a5cff'],['#ff5a3c','#ffc46b'],['#4cc9ff','#c04cff'],['#d9ff5a','#2ea8ff']];
const s=fxShader(document.getElementById('c'),frag,{uA:fxHex(pals[0][0]),uB:fxHex(pals[0][1])});
const pal=document.getElementById('pal');
pals.forEach((p,i)=>{const b=document.createElement('button');b.style.background='linear-gradient(135deg,'+p[0]+','+p[1]+')';b.setAttribute('aria-label','Paleta '+(i+1));b.setAttribute('aria-pressed',i===0);b.onclick=()=>{s.set('uA',fxHex(p[0]));s.set('uB',fxHex(p[1]));pal.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b))};pal.appendChild(b)});
</script>
<script src="../../assets/catalogo.js"></script>
<script src="../../assets/demo.js"></script>
</body>
</html>
