<!doctype html>
<html lang="es" data-slug="texto-descifrado">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Efectos Rednet</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..800&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../assets/demo.css">
<style>
html,body{margin:0;min-height:100%;background:#07090b;color:#d8ffe9;font-family:Geist,system-ui,sans-serif}
main{min-height:100svh;display:grid;place-content:center;padding:40px 16px 100px;gap:40px;text-align:center}
.lbl{font:500 12px/1 "Geist Mono",monospace;letter-spacing:.14em;text-transform:uppercase;color:#3dffa0}
h1{font:600 clamp(40px,8vw,112px)/1 "Geist Mono",monospace;letter-spacing:-.04em;margin:14px 0 0;color:#f2fff7}
h1 .x,nav .x{color:#3dffa0;opacity:.7}
p{color:#8fa79a;max-width:460px;margin:12px auto 0;line-height:1.5}
nav{display:flex;flex-wrap:wrap;justify-content:center;gap:10px 28px}
nav a{font:500 18px "Geist Mono",monospace;color:#d8ffe9;text-decoration:none;letter-spacing:.04em;padding:6px 2px;border-bottom:1px solid transparent}
nav a:hover{border-color:#3dffa0}
.scan{position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 1px,transparent 1px 3px)}
</style>
</head>
<body>
<div class="scan" aria-hidden="true"></div>
<main>
 <div><span class="lbl">JS puro · ~25 líneas</span><h1 data-dec aria-label="Protegemos tus datos">Protegemos tus datos</h1><p>Se descifra al cargar. Pasa el mouse por el menú.</p></div>
 <nav aria-label="Menú de ejemplo"><a href="#" data-dec data-hover>RESPALDOS</a><a href="#" data-dec data-hover>FIREWALL</a><a href="#" data-dec data-hover>MONITOREO</a><a href="#" data-dec data-hover>SOPORTE 24/7</a></nav>
</main>
<script>
// decrypt(el): cada letra pasa por caracteres al azar y se "fija" de izquierda a derecha
const CH='ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789#%&*$@<>/';
function decrypt(el,{vel=28,pasos=8}={}){
  const fin=el.dataset.txt||(el.dataset.txt=el.textContent);cancelAnimationFrame(el._r);let f=0,last=0;
  const tick=t=>{if(t-last>=vel){last=t;f++;el.innerHTML=fin.split('').map((c,i)=>{if(c===' ')return' ';if(f>=i*1.2+pasos)return c;return'<span class="x">'+CH[Math.random()*CH.length|0]+'</span>'}).join('')}
    if(f<fin.length*1.2+pasos)el._r=requestAnimationFrame(tick);else el.textContent=fin};
  el._r=requestAnimationFrame(tick)}
if(!matchMedia('(prefers-reduced-motion: reduce)').matches){
 document.querySelectorAll('[data-dec]').forEach((el,i)=>setTimeout(()=>decrypt(el),300+i*120));
 document.querySelectorAll('[data-hover]').forEach(el=>{el.addEventListener('mouseenter',()=>decrypt(el,{vel:22,pasos:4}));el.addEventListener('focus',()=>decrypt(el,{vel:22,pasos:4}))});}
document.querySelectorAll('nav a').forEach(a=>a.addEventListener('click',e=>e.preventDefault()));
</script>
<script src="../../assets/catalogo.js"></script>
<script src="../../assets/demo.js"></script>
</body>
</html>
