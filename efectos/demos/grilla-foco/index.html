<!doctype html>
<html lang="es" data-slug="grilla-foco">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Efectos Rednet</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..800&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../assets/demo.css">
<style>html,body{margin:0;height:100%;background:#0e0d0c;color:#f2f0ec;font-family:Geist,system-ui,sans-serif;overflow:hidden}
.hero{position:relative;z-index:2;height:100%;display:grid;place-content:center;text-align:center;padding:0 16px;pointer-events:none}
.hero small{font:500 12px/1 "Geist Mono",monospace;letter-spacing:.14em;text-transform:uppercase;opacity:.75}
.hero h1{font-size:clamp(40px,8vw,104px);line-height:.95;letter-spacing:-.04em;margin:14px 0 0;font-weight:650}
.hero p{max-width:460px;margin:18px auto 0;color:#cfcac2;font-size:17px;line-height:1.5}
.g{position:fixed;inset:0;--x:50%;--y:40%}
.g::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.14) 1px,transparent 1.4px);background-size:22px 22px}
.g::after{content:"";position:absolute;inset:0;background-image:radial-gradient(#ff7a5c 1.2px,transparent 1.6px);background-size:22px 22px;
 -webkit-mask:radial-gradient(260px circle at var(--x) var(--y),#000,transparent 70%);mask:radial-gradient(260px circle at var(--x) var(--y),#000,transparent 70%)}
.glow{position:fixed;width:640px;height:640px;left:var(--x);top:var(--y);translate:-50% -50%;background:radial-gradient(closest-side,rgba(255,90,60,.16),transparent);pointer-events:none}
.beam{position:fixed;height:1px;width:38vw;background:linear-gradient(90deg,transparent,#ff8a6c,#fff,transparent);filter:drop-shadow(0 0 6px #ff5a3c);opacity:0;animation:b 7s linear infinite}
.beam:nth-child(1){top:22%;animation-delay:0s}.beam:nth-child(2){top:58%;animation-delay:2.4s;width:26vw}.beam:nth-child(3){top:81%;animation-delay:4.6s}
.beamv{position:fixed;width:1px;height:34vh;background:linear-gradient(180deg,transparent,#8fb4ff,#fff,transparent);filter:drop-shadow(0 0 6px #5c8cff);opacity:0;animation:bv 8s linear infinite;left:27%;animation-delay:1.2s}
.beamv.b2{left:73%;animation-delay:5s}
@keyframes b{0%{transform:translateX(-40vw);opacity:0}8%{opacity:1}60%{opacity:1}70%,100%{transform:translateX(140vw);opacity:0}}
@keyframes bv{0%{transform:translateY(-40vh);opacity:0}8%{opacity:1}60%{opacity:1}70%,100%{transform:translateY(140vh);opacity:0}}
.fade{position:fixed;inset:0;background:radial-gradient(ellipse at center,transparent 30%,#0e0d0c 85%);pointer-events:none}
@media (prefers-reduced-motion:reduce){.beam,.beamv{display:none}}
</style>
</head>
<body>
<div class="g" id="g"><div class="glow"></div></div>
<div aria-hidden="true"><i class="beam"></i><i class="beam"></i><i class="beam"></i><i class="beamv"></i><i class="beamv b2"></i></div>
<div class="fade"></div>
<div class="hero"><small>CSS · 12 líneas de JS</small><h1>Software<br>que se nota</h1><p>Una grilla de puntos que se enciende donde miras. Haces de luz cruzan cada pocos segundos.</p></div>
<script>
const g=document.getElementById('g');let tx=innerWidth/2,ty=innerHeight*.4,x=tx,y=ty;
addEventListener('pointermove',e=>{tx=e.clientX;ty=e.clientY});
(function f(){x+=(tx-x)*.12;y+=(ty-y)*.12;g.style.setProperty('--x',x+'px');g.style.setProperty('--y',y+'px');requestAnimationFrame(f)})();
</script>
<script src="../../assets/catalogo.js"></script>
<script src="../../assets/demo.js"></script>
</body>
</html>
