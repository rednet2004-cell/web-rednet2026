<!doctype html>
<html lang="es" data-slug="marquee-scroll">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Efectos Rednet</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..800&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../assets/demo.css">
<style>
html{background:#0e0d0c}body{margin:0;background:#0e0d0c;color:#f2f0ec;font-family:Geist,system-ui,sans-serif;overflow-x:hidden}
.lbl{font:500 12px/1 "Geist Mono",monospace;letter-spacing:.14em;text-transform:uppercase;color:#ff7a5c}
.intro{min-height:60svh;display:grid;place-content:center;text-align:center;padding:0 16px}
.intro h1{font-size:clamp(40px,7vw,96px);letter-spacing:-.04em;line-height:.95;margin:16px 0;font-weight:650}
.intro p{color:#a8a39b;margin:0}
.mq{overflow:hidden;white-space:nowrap;padding:3vh 0;border-block:1px solid rgba(255,255,255,.1)}
.mq .row{display:inline-flex;will-change:transform}
.mq span{font-size:clamp(48px,9vw,140px);font-weight:700;letter-spacing:-.05em;padding-right:.4em;display:inline-flex;align-items:center;gap:.4em}
.mq span::after{content:"✦";font-size:.4em;color:#ff5a3c}
.mq.o span{color:transparent;-webkit-text-stroke:1.5px rgba(242,240,236,.6)}
.mq.o{transform:rotate(-3deg) scale(1.06);background:#ff5a3c;border:0}.mq.o span{-webkit-text-stroke:1.5px #140a07}.mq.o span::after{color:#140a07}
.logos{padding:5vh 0}.logos span{font-size:clamp(22px,3vw,34px);font-weight:600;letter-spacing:-.02em;color:#a8a39b;padding-right:2.2em}.logos span::after{content:none}
.spacer{height:120svh;display:grid;place-content:center;color:#a8a39b;text-align:center;padding:0 16px}
</style>
</head>
<body>
<section class="intro"><span class="lbl">GSAP · velocidad del scroll</span><h1>Cintas que<br>sienten el scroll</h1><p>Baja rápido, frena, sube: cambian de velocidad y de sentido.</p></section>
<div class="mq" data-dir="1"><div class="row"><span>Bodegaje</span><span>Distribución</span><span>Última milla</span><span>WMS</span></div></div>
<div class="mq o" data-dir="-1"><div class="row"><span>Diseño web</span><span>Hosting</span><span>SEO</span><span>Soporte</span></div></div>
<div class="mq logos" data-dir="1" data-speed=".6"><div class="row"><span>ACME</span><span>Norte Sur</span><span>Andes Foods</span><span>Pacífico</span><span>Vértice</span><span>Lumen</span><span>Orbe</span></div></div>
<div class="spacer"><p>Sigue bajando y subiendo para jugar con la velocidad.</p></div>
<script src="../../vendor/gsap.min.js"></script>
<script>
// Duplica el contenido hasta cubrir 2 pantallas y lo mueve en bucle; el scroll suma velocidad y define el sentido
const rows=[...document.querySelectorAll('.mq')].map(mq=>{const r=mq.querySelector('.row'),html=r.innerHTML;while(r.scrollWidth<innerWidth*2.2)r.innerHTML+=html;
  const half=r.scrollWidth/2;return{r,half,x:0,dir:+mq.dataset.dir,base:+(mq.dataset.speed||1)}});
let lastY=scrollY,vel=0,sentido=1;
addEventListener('scroll',()=>{const d=scrollY-lastY;lastY=scrollY;vel+=d*.25;if(Math.abs(d)>1)sentido=Math.sign(d)});
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
gsap.ticker.add((t,dt)=>{vel*=.9;if(reduce)return;const k=dt/16.7;
  rows.forEach(o=>{o.x-=(o.base*1.2*sentido+vel)*o.dir*k;o.x=gsap.utils.wrap(-o.half,0,o.x);o.r.style.transform='translate3d('+o.x+'px,0,0) skewX('+gsap.utils.clamp(-12,12,-vel*.4*o.dir)+'deg)'})});
</script>
<script src="../../assets/catalogo.js"></script>
<script src="../../assets/demo.js"></script>
</body>
</html>
